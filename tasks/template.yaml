meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 3
  est_tokens: "15-20k"
  est_cost_rub: "12-18"
student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2)"
  topic: "{{UNIT_TOPIC}}"
settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1
steps:
  - id: start
    type: gate
    say: |
      Hi! This is a 50-point task based on the article "Distributed Representations of Words and Phrases" (Mikolov et al., 2013).
      Part 1: Grammar - Passive Voice (10 MCQs, 10 pts)
      Part 2: Reading Comprehension - Scanning (5 questions, 15 pts)
      Part 3: Opinion Essay (150-200 words, 25 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  # === PART 1: GRAMMAR (10 pts) ===
  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: r1

  # === PART 2: READING COMPREHENSION (15 pts) ===
  - id: r1
    type: question
    topic: "Reading Q1"
    say: "According to the article, what year does the earliest use of word representations date back to?"
    next: r2

  - id: r2
    type: question
    topic: "Reading Q2"
    say: "Approximately how many words can an optimized single-machine implementation train in one day?"
    next: r3

  - id: r3
    type: question
    topic: "Reading Q3"
    say: "What is the mathematical formula used to calculate the probability of discarding a word during subsampling?"
    next: r4

  - id: r4
    type: question
    topic: "Reading Q4"
    say: "What is the typical value of the chosen threshold t in the subsampling formula?"
    next: r5

  - id: r5
    type: question
    topic: "Reading Q5"
    say: "What is the dimensionality of the vectors used in the experiments summarized in Table 1?"
    next: essay_write

  # === PART 3: OPINION ESSAY (25 pts) ===
  - id: essay_write
    type: question
    topic: "Opinion Essay"
    say: |
      Write a short essay (150-200 words) expressing your opinion on the following topic:
      
      "Do you think the approach described in the article (using mathematical vectors to represent words) will change how we teach languages in the future? Why or why not?"
      
      Try to use Passive Voice where appropriate and academic vocabulary.
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "answers"]
    output: schemas.final_grade
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: ["student_context", "answers", "final_grade"]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: final_grade.profile_notes
    say: "Here is your comprehensive Digital Presentation. Great work!"
    next: done

prompts:
  final_grade: |
    You are an expert English tutor. Evaluate the student's reading comprehension answers and opinion essay.
    
    Student: 18 y.o., math major, B1 targeting B2.
    Article: "Distributed Representations of Words and Phrases and their Compositionality" (Mikolov et al., 2013)
    
    READING ANSWERS (5 questions):
    Q1 (year of earliest word representations): {r1}
    Q2 (words trained per day): {r2}
    Q3 (subsampling formula): {r3}
    Q4 (threshold t value): {r4}
    Q5 (vector dimensionality): {r5}
    
    Correct answers for reference:
    Q1: 1986
    Q2: More than 100 billion words
    Q3: P(wi) = 1 - sqrt(t / f(wi))
    Q4: Around 10^-5
    Q5: 300-dimensional vectors
    
    ESSAY (opinion on whether vector representations will change language teaching):
    {essay_write}
    
    Evaluate on three criteria:
    1. READING ACCURACY (0-15): How many of the 5 reading questions are answered correctly? Give 3 points per correct answer.
    2. ESSAY TASK ACHIEVEMENT (0-15): Is the opinion clearly stated? Are arguments supported? Is the length appropriate (150-200 words)?
    3. ESSAY LANGUAGE (0-10): Grammar (especially Passive Voice), vocabulary range, coherence, academic style.
    
    Return STRICT JSON only:
    {{
      "reading_score": 0,
      "essay_task_achievement": 0,
      "essay_language": 0,
      "total": 0,
      "reading_feedback": "Brief comment on reading answers",
      "essay_strengths": ["...", "..."],
      "essay_improvements": ["...", "..."],
      "errors": [{{"original": "...", "corrected": "...", "explanation": "..."}}],
      "recommended_vocabulary": [
        {{"word": "...", "definition": "...", "example": "..."}},
        ... (6-8 items)
      ],
      "profile_notes": {{
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."],
        "grammar_gaps": ["..."]
      }}
    }}
    Rules:
    - errors: 2-3 items from the essay, original — verbatim quote
    - recommended_vocabulary: 6-8 advanced B2-C1 words related to NLP, machine learning, or academic writing that the student should learn
    - All feedback in ENGLISH

  report: |
    You are an expert tutor. Create a final Markdown report.
    
    STUDENT: {student_context}
    GRAMMAR SCORE: 10/10 (from multiple-choice test)
    
    READING ANSWERS:
    Q1: {r1}
    Q2: {r2}
    Q3: {r3}
    Q4: {r4}
    Q5: {r5}
    
    ESSAY:
    {essay_write}
    
    GRADE:
    Reading Score: {final_grade_reading_score}/15
    Essay Task Achievement: {final_grade_essay_task_achievement}/15
    Essay Language: {final_grade_essay_language}/10
    Total: {final_grade_total}/50
    
    Reading Feedback: {final_grade_reading_feedback}
    Essay Strengths: {final_grade_essay_strengths}
    Essay Improvements: {final_grade_essay_improvements}
    Recommended Vocabulary: {final_grade_recommended_vocabulary}
    
    The report must contain:
    ## 1. Grammar Keys (Passive Voice)
    Brief table of correct answers for the 10 grammar questions with explanations for 2-3 tricky cases.
    
    ## 2. Reading Comprehension Key
    List all 5 questions with correct answers and brief explanations.
    
    ## 3. Student's Essay
    Present the student's essay as submitted.
    
    ## 4. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Grammar (Passive Voice) | 10 | 10 |
    | Reading Comprehension | {final_grade_reading_score} | 15 |
    | Essay Task Achievement | {final_grade_essay_task_achievement} | 15 |
    | Essay Language | {final_grade_essay_language} | 10 |
    | **TOTAL** | **{final_grade_total}** | **50** |
    
    ## 5. Detailed Feedback
    **Reading Feedback**: {final_grade_reading_feedback}
    **Essay Strengths**: {final_grade_essay_strengths}
    **Areas for Improvement**: {final_grade_essay_improvements}
    
    ## 6. Personalized Vocabulary Upgrade
    Based on the student's essay and reading answers, suggest 6-8 advanced B2-C1 academic words/collocations related to NLP, machine learning, and mathematical writing that the student should learn next. For each provide:
    - Word/phrase
    - Definition (in English)
    - Example sentence in academic context
    
    Output ONLY the Markdown.

schemas:
  final_grade:
    reading_score: "int 0..15"
    essay_task_achievement: "int 0..15"
    essay_language: "int 0..10"
    total: "int 0..50"
    reading_feedback: "str"
    essay_strengths: "list"
    essay_improvements: "list"
    errors: "list"
    recommended_vocabulary: "list"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
      grammar_gaps: "list"
  report:
    grammar_keys: "str"
    reading_key: "str"
    student_essay: "str"
    metrics: "str"
    feedback: "str"
    vocab_upgrade: "list"

templates:
  final_md: |
    # Digital Presentation: {{UNIT_TITLE}}
    Student: {student_name} · Date: {date}
    
    ## 1. Grammar Keys (Passive Voice)
    {report_grammar_keys}
    
    ## 2. Reading Comprehension Key
    {report_reading_key}
    
    ## 3. Student's Essay
    {report_student_essay}
    
    ## 4. Performance Metrics
    {report_metrics}
    
    ## 5. Detailed Feedback
    {report_feedback}
    
    ## 6. Personalized Vocabulary Upgrade
    {for v in report_vocab_upgrade}
    **{v.word}** — {v.definition}
    *Example: {v.example}*
    {end}
    
  teacher_meta: |
    ### For teacher only
    Raw answers: {answers_raw}
    Tokens: {token_usage}
    Hash: {report_hash}
