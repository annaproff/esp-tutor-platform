meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 3
  est_tokens: "18-22k"
  est_cost_rub: "15-22"
student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2)"
  topic: "{{UNIT_TOPIC}}"
settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  timing:
    remind_after_hours: 24
    expire_after_days: 7
  attempts:
    max: 1
steps:
  - id: start
    type: gate
    say: |
      Hi! This is a comprehensive 50-point task.
      Part 1: Grammar - {{UNIT_GRAMMAR}} (10 MCQs, 10 pts)
      Part 2: Personalized Vocabulary (10 MCQs, 10 pts)
      Part 3: Interview (6 questions, 30 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: v_q1

  - id: v_q1
    type: question
    topic: "Devices & Operations"
    audio: true
    say: "Tell me about the devices you use daily and what you typically do with them. Speak for 30-60 seconds."
    next: v_q2

  - id: v_q2
    type: question
    topic: "Your Favorite Apps"
    audio: true
    say: "Describe your top 2-3 apps and what you use them for. Speak for 30-60 seconds."
    next: v_generate

  - id: v_generate
    type: llm
    model: yandexgpt-pro
    temperature: 0.3
    prompt: prompts.v_generate
    inputs: ["student_context", "answers.v_q1", "answers.v_q2"]
    output: schemas.v_generate
    checks:
      - "vocab_list: 6 items"
      - "vocab_mcq: exactly 10 items"
      - "interview_questions: exactly 6 items"
    on_check_fail: "retry 1 time"
    save_as: vocab_context
    next: v_mcq_task

  - id: v_mcq_task
    type: dynamic_mcq
    topic: "{{SECTION_2_TITLE}}"
    next: i1

  - id: i1
    type: question
    topic: "Interview Q1"
    audio: true
    say: "{vocab_context.iq1}"
    next: i2

  - id: i2
    type: question
    topic: "Interview Q2"
    audio: true
    say: "{vocab_context.iq2}"
    next: i3

  - id: i3
    type: question
    topic: "Interview Q3"
    audio: true
    say: "{vocab_context.iq3}"
    next: i4

  - id: i4
    type: question
    topic: "Interview Q4"
    audio: true
    say: "{vocab_context.iq4}"
    next: i5

  - id: i5
    type: question
    topic: "Interview Q5"
    audio: true
    say: "{vocab_context.iq5}"
    next: i6

  - id: i6
    type: question
    topic: "Interview Q6"
    audio: true
    say: "{vocab_context.iq6}"
    after_save_say: "Thank you! Give me a moment to review your answers and calculate your final score."
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "vocab_context", "answers", "vocab_grade"]
    output: schemas.final_grade
    checks:
      - "accuracy: int 0..20"
      - "fluency: int 0..10"
    on_check_fail: "retry 1 time"
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: ["student_context", "answers", "vocab_context", "vocab_grade", "final_grade"]
    output: schemas.report
    checks:
      - "corrected_interview: exactly 6 items"
      - "vocab_upgrade: exactly 5 items"
    on_check_fail: "retry 1 time"
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      write_row: "results_table: student | task | grammar | vocab | accuracy | fluency | total | date"
      update_profile: final_grade.profile_notes
    say: "Here is your comprehensive Digital Presentation. Great work!"
    next: done

rubric:
  grammar_score:
    "10": "Perfect understanding of Passive Voice forms"
    "7-9": "Good understanding; minor errors"
    "4-6": "Basic understanding; several errors"
    "0-3": "Poor understanding; most answers incorrect"
  accuracy:
    "17-20": "Minor errors; B2 vocabulary appropriate; good use of passive and personalized vocab"
    "13-16": "Several tense/article errors; mostly B1+ lexicon"
    "9-12": "Regular basic tense errors; noticeable L1 calques"
    "5-8": "Errors impede understanding; limited vocabulary"
    "0-4": "Understanding difficult in most answers"
  fluency:
    "9-10": "Coherent extended answers; diverse discourse markers"
    "7-8": "Coherent but markers basic (and, but, because)"
    "5-6": "Short/choppy answers; few connectors"
    "3-4": "Isolated phrases without connection"
    "0-2": "One-word answers"

prompts:
  v_generate: |
    You are an expert English tutor specializing in vocabulary acquisition.
    
    The student has just described their tech habits in two audio recordings (transcribed below).
    
    Student's answer about devices:
    {v_q1}
    
    Student's answer about apps:
    {v_q2}
    
    TASK 1: Based on what the student said, select 6 advanced B2-level English expressions/collocations that:
    - Are semantically related to what the student described
    - Are at B2 level (not too easy, not C2)
    - Are natural, high-frequency expressions used by native speakers
    - Cover a mix of verbs, nouns, and phrases
    
    TASK 2: Create exactly 10 multiple-choice questions to practice these 6 expressions.
    Each question should test understanding of the expression in context.
    Format: one expression per question, 4 options (A-D), one correct answer.
    
    TASK 3: Create exactly 6 interview questions that:
    - Use Passive Voice (to practice grammar from Part 1)
    - Naturally incorporate 1-2 of the 6 new expressions each
    - Are open-ended and encourage extended answers
    - Are relevant to the student's tech habits
    
    Return STRICT JSON only. No markdown code blocks, no explanations outside JSON.
    {
      "vocab_list": [
        {"expression": "deploy a solution", "definition": "to put a plan or system into action", "example": "The company deployed a new solution to handle customer complaints."},
        ... (exactly 6 items)
      ],
      "vocab_mcq": [
        {"id": 1, "question": "The IT team had to ______ a new solution to fix the server issue.", "options": {"A": "deploy", "B": "delete", "C": "delay", "D": "describe"}, "correct": "A"},
        ... (exactly 10 items, each testing one of the 6 expressions)
      ],
      "iq1": "How is your favorite app ______ (passive) by its developers to ______ (expression 1)?",
      "iq2": "...",
      "iq3": "...",
      "iq4": "...",
      "iq5": "...",
      "iq6": "..."
    }
    
    Rules:
    - All content in ENGLISH
    - Questions must be natural and engaging
    - Interview questions MUST use Passive Voice

  final_grade: |
    You are an expert English tutor. Evaluate the student's 6 interview answers.
    
    Personalized vocabulary the student was expected to use:
    {vocab_list_text}
    
    Student answers (transcribed from audio):
    1: {i1}
    2: {i2}
    3: {i3}
    4: {i4}
    5: {i5}
    6: {i6}
    
    Evaluate on two criteria:
    1. ACCURACY (0-20): grammar (especially Passive Voice), lexical precision, attempt to use the 6 personalized expressions
    2. FLUENCY (0-10): coherence, discourse markers, naturalness, length of answers
    
    Return STRICT JSON only, no markdown:
    {
      "accuracy": 0,
      "fluency": 0,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{"original": "...", "corrected": "...", "explanation": "..."}],
      "profile_notes": {
        "recurring_errors": ["..."],
        "resolved_since_last": ["..."],
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."]
      }
    }
    Rules:
    - errors: exactly 2-3 items, original — verbatim quote from answers
    - strengths/improvements: 2-3 items each
    - All feedback in ENGLISH

  report: |
    You are an expert tutor. Create a final Markdown report.
    STUDENT: {student_context}
    PERSONALIZED VOCABULARY (6 expressions): {vocab_list_text}
    GRADE: {final_grade}
    
    The report must contain:
    ## 1. Grammar Keys (Passive Voice)
    Brief table of correct answers for the 10 grammar questions with explanations for 2-3 tricky cases.
    ## 2. Your Personalized Vocabulary (6 expressions)
    For each expression: definition + example.
    ## 3. Vocabulary Practice Key
    List of 10 vocabulary questions with correct answers and brief explanations.
    ## 4. Interview Transcript (Corrected)
    Rewrite each of the 6 interview answers as natural B2-level English, preserving meaning and demonstrating ideal use of Passive Voice and the 6 personalized expressions.
    ## 5. Performance Metrics
    Table with scores (Grammar /10, Vocab /10, Accuracy /20, Fluency /10, Total /50).
    ## 6. Detailed Feedback
    **Strengths**: {strengths}
    **Areas for Improvement**: {improvements}
    ## 7. Next Steps
    5 advanced IT words/collocations the student should study next (with definitions and examples).
    Output ONLY the Markdown.

schemas:
  v_generate:
    vocab_list: "list"
    vocab_mcq: "list"
    iq1: "str"
    iq2: "str"
    iq3: "str"
    iq4: "str"
    iq5: "str"
    iq6: "str"
  final_grade:
    accuracy: "int 0..20"
    fluency: "int 0..10"
    strengths: "list"
    improvements: "list"
    errors: "list"
    profile_notes:
      recurring_errors: "list"
      resolved_since_last: "list"
      estimated_level: "str"
      vocabulary_gaps: "list"
  report:
    grammar_keys: "str"
    vocab_keys: "str"
    corrected_interview: "list"
    metrics: "str"
    feedback: "str"
    vocab_upgrade: "list"

templates:
  final_md: |
    # Digital Presentation: {{UNIT_TITLE}}
    Student: {student_name} · Date: {date}

    ## 1. Grammar Keys (Passive Voice)
    {report.grammar_keys}

    ## 2. Your Personalized Vocabulary (6 expressions)
    {report.vocab_keys}

    ## 3. Vocabulary Practice Key
    {report.vocab_practice_key}

    ## 4. Interview Transcript (Corrected)
    {for i, c in report.corrected_interview}**Q{i}.** {c}{end}

    ## 5. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Grammar (Passive) | 10 | 10 |
    | Vocabulary (Personalized) | {vocab_grade.vocab_score} | 10 |
    | Interview Accuracy | {final_grade.accuracy} | 20 |
    | Interview Fluency | {final_grade.fluency} | 10 |
    | **TOTAL** | **{final_grade.total}** | **50** |

    ## 6. Detailed Feedback
    **Strengths**
    {for s in final_grade.strengths}- {s}{end}
    **Areas for Improvement**
    {for i in final_grade.improvements}- {i}{end}

    ## 7. Next Steps
    {for v in report.vocab_upgrade}- **{v.term}** — {v.definition}
      *Example: {v.example}*{end}

  teacher_meta: |
    ### For teacher only
    Raw answers (Tests + Interview): {answers_raw}
    Personalized vocabulary: {vocab_context.vocab_list_text}
    Flags: {flags}
    Tokens: {token_usage}
    Hash: {report_hash}
