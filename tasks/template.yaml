--- public/template.yaml (原始)


+++ public/template.yaml (修改后)
meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 3
  est_tokens: "15-20k"
  est_cost_rub: "12-18"
  student_context:
    age: 18
    major: mathematics
    level: "B1 (target: B2)"
    topic: "{{UNIT_TOPIC}}"

settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1

steps:
  - id: start
    type: gate
    say: |
      Hi! This is a 50-point task based on the article "Distributed Representations of Words and Phrases" (Mikolov et al., 2013).

      **Part 1:** Grammar - Passive Voice (10 MCQs, 10 pts)
      **Part 2:** Reading Comprehension - Scanning (5 questions, 15 pts)
      **Part 3:** Opinion Essay (150-200 words, 25 pts)

      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: r1

  - id: r1
    type: question
    topic: "Reading Q1"
    say: |
      Based on the article "Distributed Representations of Words and Phrases" (Mikolov et al., 2013):
      https://arxiv.org/abs/1310.4546

      What year does the earliest use of word representations date back to?
    next: r2

  - id: r2
    type: question
    topic: "Reading Q2"
    say: |
      According to the article, approximately how many words can an optimized single-machine implementation train in one day?
    next: r3

  - id: r3
    type: question
    topic: "Reading Q3"
    say: |
      What is the mathematical formula used to calculate the probability of discarding a word during subsampling?
    next: r4

  - id: r4
    type: question
    topic: "Reading Q4"
    say: |
      What is the typical value of the chosen threshold t in the subsampling formula?
    next: r5

  - id: r5
    type: question
    topic: "Reading Q5"
    say: |
      What is the dimensionality of the vectors used in the experiments summarized in Table 1?
    next: essay_write

  - id: essay_write
    type: question
    topic: "Opinion Essay"
    say: |
      Write a short essay (150-200 words) expressing your opinion on the following topic:

      "Do you think the approach described in the article (using mathematical vectors to represent words) will change how we teach languages in the future? Why or why not?"

      Try to use Passive Voice where appropriate and academic vocabulary.
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-5-lite
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "answers"]
    output: schemas.final_grade
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-5-lite
    temperature: 0.3
    prompt: prompts.report
    inputs: ["student_context", "answers", "final_grade"]
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: final_grade.profile_notes
    say: "Here is your personalized feedback. Great work!"
    next: done

prompts:
  final_grade: |
    You are an expert English tutor. Evaluate the student's reading comprehension answers and opinion essay.

    Student: 18 y.o., math major, B1 targeting B2.
    Article: "Distributed Representations of Words and Phrases and their Compositionality" (Mikolov et al., 2013)

    READING ANSWERS (5 questions):
    Q1 (year of earliest word representations): {r1}
    Q2 (words trained per day): {r2}
    Q3 (subsampling formula): {r3}
    Q4 (threshold t value): {r4}
    Q5 (vector dimensionality): {r5}

    Correct answers for reference:
    Q1: 1986
    Q2: More than 100 billion words
    Q3: P(wi) = 1 - sqrt(t / f(wi))
    Q4: Around 10^-5
    Q5: 300-dimensional vectors

    ESSAY (opinion on whether vector representations will change language teaching):
    {essay_write}

    Evaluate on three criteria:
    1. READING ACCURACY (0-15): How many of the 5 reading questions are answered correctly? Give 3 points per correct answer.
    2. ESSAY TASK ACHIEVEMENT (0-15): Is the opinion clearly stated? Are arguments supported? Is the length appropriate (150-200 words)?
    3. ESSAY LANGUAGE (0-10): Grammar (especially Passive Voice), vocabulary range, coherence, academic style.

    Return STRICT JSON only:
    {{
      "reading_score": 0,
      "essay_task_achievement": 0,
      "essay_language": 0,
      "total": 0,
      "reading_feedback": "Brief comment on reading answers",
      "essay_strengths": ["...", "..."],
      "essay_improvements": ["...", "..."],
      "errors": [{{"original": "...", "corrected": "...", "explanation": "..."}}],
      "recommended_vocabulary": [
        {{"word": "...", "definition": "...", "example": "..."}}
      ],
      "profile_notes": {{
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."],
        "grammar_gaps": ["..."]
      }}
    }}

    Rules:
    - errors: 2-3 items from the essay, original — verbatim quote
    - recommended_vocabulary: 6-8 advanced B2-C1 words related to NLP, machine learning, or academic writing that the student should learn
    - All feedback in ENGLISH

  report: |
    You are a friendly English tutor. Write a personalized feedback message to the student based on their results.

    STUDENT: 18 years old, math major, B1-B2 level.

    GRAMMAR TEST: 10/10 (all correct!)

    READING COMPREHENSION:
    Student's answers:
    Q1 (year): {r1}
    Q2 (words per day): {r2}
    Q3 (formula): {r3}
    Q4 (threshold t): {r4}
    Q5 (dimensionality): {r5}

    Correct answers: Q1: 1986, Q2: More than 100 billion words, Q3: P(wi) = 1 - sqrt(t / f(wi)), Q4: Around 10^-5, Q5: 300-dimensional vectors

    Reading score: {final_grade_reading_score}/15
    Reading feedback: {final_grade_reading_feedback}

    ESSAY:
    {essay_write}

    Essay scores:
    - Task Achievement: {final_grade_essay_task_achievement}/15
    - Language: {final_grade_essay_language}/10

    Essay strengths: {final_grade_essay_strengths}
    Essay improvements: {final_grade_essay_improvements}

    Please write a warm, personalized feedback message in English. Include:
    1. Brief analysis of their reading and essay results (what they did well, what needs work)
    2. Specific recommendations for grammar (especially Passive Voice)
    3. 6-8 advanced B2-C1 words/collocations related to NLP/math they should learn (with definitions and examples)
    4. A motivating conclusion

    Write simply and clearly, like a tutor talking to a student. No complex markdown structures, just clear text with basic formatting.

    Output ONLY the Markdown feedback text. Do NOT wrap in JSON.

schemas:
  final_grade:
    reading_score: "int 0..15"
    essay_task_achievement: "int 0..15"
    essay_language: "int 0..10"
    total: "int 0..50"
    reading_feedback: "str"
    essay_strengths: "list"
    essay_improvements: "list"
    errors: "list"
    recommended_vocabulary: "list"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
      grammar_gaps: "list"

templates:
  final_md: |
    {report_feedback_text}

  teacher_meta: |
    ### For teacher only
    Raw answers: {answers_raw}
    Tokens: {token_usage}
    Hash: {report_hash}
