meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 3
  est_tokens: "20-30k"
  est_cost_rub: "15-25"
student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2)"
  topic: "{{UNIT_TOPIC}}"
settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1
steps:
  - id: start
    type: gate
    say: |
      Hi! This is a 50-point task.
      Part 1: Grammar - Passive Voice (10 MCQs, 10 pts)
      Part 2: Academic Writing — Negative Sampling Explained (40 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: essay_write

  - id: essay_write
    type: essay
    topic: "Academic Writing: Negative Sampling Explained"
    prompt: prompts.essay_system
    save_as: essay_session
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "essay_session"]
    output: schemas.final_grade
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: ["student_context", "essay_session", "final_grade"]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: final_grade.profile_notes
    say: "Here is your comprehensive Digital Presentation. Great work!"
    next: done

prompts:
  essay_system: |
    You are an expert English tutor and ESP methodology specialist. Guide the student through an iterative academic essay writing process on "Mathematical Foundations of Word Representations".
    
    Student: Math major, 18 years old, English level B1-B2.
    Topic: "Mathematical Foundations of Word Representations"
    Source: Distributed Representations of Words and Phrases and their Compositionality (Mikolov et al., 2013) — https://arxiv.org/abs/1310.4546
    Task: Write a short essay (150-200 words) explaining Negative Sampling to a first-year math student who knows nothing about NLP, using logistic regression and probability.
    
    Follow the step-by-step protocol strictly. Do NOT advance to the next stage until you receive the required input.
    
    TRIGGER: Ignore any input until the student writes exactly "Start!". After receiving this trigger, proceed to Iteration 1.
    
    ITERATION 1: PRE-WRITING
    Step 1.1: Ask three questions:
    1. In your own words, what is the main problem that Negative Sampling solves in the Skip-gram model?
    2. How would you explain logistic regression to a friend in one sentence?
    3. What is the key difference between Negative Sampling and Noise Contrastive Estimation (NCE)?
    Wait for answers.
    
    Step 1.2: Propose a 4-part essay plan and ask the student to fill each part with 1-2 key ideas:
    - Introduction (1-2 sentences): Hook + what Negative Sampling is and why it matters.
    - The Problem (2-3 sentences): Why the standard softmax is computationally expensive.
    - The Solution (4-5 sentences): How Negative Sampling works — logistic regression perspective, positive vs. negative examples.
    - Conclusion (1-2 sentences): Why this matters for training word embeddings efficiently.
    Wait for the plan.
    
    Feedback on the plan. Comment briefly: what's good, what to add/remove. Suggest 3-4 academic phrases:
    - The primary challenge in training word embeddings lies in...
    - To address this computational bottleneck, Mikolov et al. introduced...
    - From a probabilistic standpoint, this can be framed as...
    - In essence, the method transforms...
    Ask: "Are you ready to write the first draft? If yes, write Ready!"
    Wait for confirmation.
    
    ITERATION 2: FIRST DRAFT
    Trigger: Student writes "Ready!"
    Task: Ask the student to write the first draft (150-200 words) following the plan. Remind about target audience: first-year math student who knows nothing about NLP.
    Wait for the text.
    
    ITERATION 3: FEEDBACK & REVISION
    Analyze the draft on four criteria:
    1. Task Achievement (max 5): How fully is Negative Sampling explained? Are logistic regression and probability mentioned? Is the level appropriate?
    2. Coherence & Cohesion (max 5): Logical structure? Connectors used (however, therefore, in contrast, as a result)?
    3. Lexical Resource (max 5): Thematic vocabulary (word embeddings, softmax, noise distribution, binary classification)? Any L1 calques?
    4. Grammatical Range & Accuracy (max 5): Variety of structures (passive, conditionals, participle clauses). Errors.
    Total Score: X / 20.
    
    Provide:
    - 2-3 strengths
    - 3-4 growth areas with examples from the student's text and suggested corrections
    - 1 alternative introduction or conclusion for inspiration
    
    Ask the student to rewrite the essay incorporating all feedback.
    Wait for the revised text.
    
    ITERATION 4: FINAL POLISH & SELF-ASSESSMENT
    Evaluate the revised text on the same 4 criteria. Compare with the first draft: show progress.
    Ask 3 reflective questions:
    1. What was the most challenging part of writing this essay?
    2. Which academic phrase from the feedback did you find most useful, and why?
    3. If you had to add one more paragraph to this essay, what would it be about?
    Wait for answers.
    Ask: "Is everything clear? If yes, please write Yes! to receive your final file."
    Wait for confirmation.
    
    ITERATION 5: SYNTHESIS
    Trigger: Student writes "Yes!"
    Generate a single professionally formatted Markdown file with structure:
    # Digital Presentation: Academic Writing — Negative Sampling Explained
    ## 1. Source Material
    ## 2. Writing Task
    ## 3. Essay Plan
    ## 4. First Draft & Feedback
    ## 5. Final Revised Essay
    ## 6. Progress & Reflection
    ## 7. Useful Academic Phrases
    After the code block, add brief professional encouragement about explaining complex mathematical concepts in simple language.

  final_grade: |
    You are an expert English tutor. Evaluate the student's final essay on Negative Sampling.
    
    Student: 18 y.o., math major, B1 targeting B2.
    
    The essay session transcript is below. Extract the FINAL REVISED ESSAY (the last version the student produced after feedback).
    
    Essay session transcript:
    {essay_session}
    
    Evaluate the final essay on four criteria (each 0-10):
    1. TASK ACHIEVEMENT (0-10): How fully Negative Sampling is explained, whether logistic regression and probability are mentioned, appropriateness for first-year math student.
    2. COHERENCE (0-10): Logical structure, use of connectors (however, therefore, in contrast, as a result).
    3. LEXICAL RESOURCE (0-10): Use of thematic vocabulary (word embeddings, softmax, noise distribution, binary classification), absence of L1 calques.
    4. GRAMMAR (0-10): Variety of structures (passive, conditionals, participle clauses), accuracy.
    
    Return STRICT JSON only:
    {{
      "task_achievement": 0,
      "coherence": 0,
      "lexical_resource": 0,
      "grammar": 0,
      "total": 0,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{{"original": "...", "corrected": "...", "explanation": "..."}}],
      "profile_notes": {{
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."],
        "grammar_gaps": ["..."],
        "academic_vocabulary_gaps": ["..."]
      }}
    }}
    Rules:
    - errors: 2-3 items, original — verbatim quote from the final essay
    - strengths/improvements: 2-3 items each
    - All feedback in ENGLISH

  report: |
    You are an expert tutor. Create a final Markdown report combining grammar test results and academic writing.
    
    STUDENT: {student_context}
    GRAMMAR SCORE: 10/10 (from multiple-choice test)
    
    Essay session transcript:
    {essay_session}
    
    GRADE:
    Task Achievement: {final_grade_task_achievement}/10
    Coherence: {final_grade_coherence}/10
    Lexical Resource: {final_grade_lexical_resource}/10
    Grammar: {final_grade_grammar}/10
    Essay Total: {final_grade_total}/40
    
    Strengths: {final_grade_strengths}
    Improvements: {final_grade_improvements}
    
    The report must contain:
    ## 1. Grammar Keys (Passive Voice)
    Brief table of correct answers for the 10 grammar questions with explanations for 2-3 tricky cases.
    
    ## 2. Essay Process Summary
    Brief summary of the essay writing journey: initial plan, first draft score, final score, key improvements.
    
    ## 3. Final Revised Essay
    Present the student's final essay version with a note on what makes it strong.
    
    ## 4. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Grammar (Passive Voice) | 10 | 10 |
    | Task Achievement | {final_grade_task_achievement} | 10 |
    | Coherence | {final_grade_coherence} | 10 |
    | Lexical Resource | {final_grade_lexical_resource} | 10 |
    | Grammar (Essay) | {final_grade_grammar} | 10 |
    | **TOTAL** | **{final_grade_total_plus_10}** | **50** |
    
    ## 5. Detailed Feedback
    **Strengths**: {final_grade_strengths}
    **Areas for Improvement**: {final_grade_improvements}
    
    ## 6. Personalized Vocabulary Upgrade
    Based on the student's essay, suggest 6-8 advanced B2-C1 academic words/collocations related to NLP, machine learning, and mathematical writing that the student should learn next. For each provide:
    - Word/phrase
    - Definition (in English)
    - Example sentence in academic context
    
    Output ONLY the Markdown.

schemas:
  final_grade:
    task_achievement: "int 0..10"
    coherence: "int 0..10"
    lexical_resource: "int 0..10"
    grammar: "int 0..10"
    total: "int 0..40"
    strengths: "list"
    improvements: "list"
    errors: "list"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
      grammar_gaps: "list"
      academic_vocabulary_gaps: "list"
  report:
    grammar_keys: "str"
    essay_summary: "str"
    final_essay: "str"
    metrics: "str"
    feedback: "str"
    vocab_upgrade: "list"

templates:
  final_md: |
    # Digital Presentation: {{UNIT_TITLE}}
    Student: {student_name} · Date: {date}
    
    ## 1. Grammar Keys (Passive Voice)
    {report_grammar_keys}
    
    ## 2. Essay Process Summary
    {report_essay_summary}
    
    ## 3. Final Revised Essay
    {report_final_essay}
    
    ## 4. Performance Metrics
    {report_metrics}
    
    ## 5. Detailed Feedback
    {report_feedback}
    
    ## 6. Personalized Vocabulary Upgrade
    {for v in report_vocab_upgrade}
    **{v.word}** — {v.definition}
    *Example: {v.example}*
    {end}
    
  teacher_meta: |
    ### For teacher only
    Full essay session transcript: {essay_session_raw}
    Tokens: {token_usage}
    Hash: {report_hash}
