meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 3
  est_tokens: "12-15k"
student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2)"
  topic: "{{UNIT_TOPIC}}"
settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1
steps:
  - id: start
    type: gate
    say: |
      Hi! This is a comprehensive 50-point task.
      Part 1: Grammar - Passive Voice (10 MCQs, 10 pts)
      Part 2: Personalized Vocabulary (6 expressions)
      Part 3: Interview (6 audio questions, 30 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  # === ЧАСТЬ 1: ГРАММАТИКА (10 вопросов) ===
  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: v_q1

  # === ЧАСТЬ 2: ПЕРСОНАЛИЗИРОВАННАЯ ЛЕКСИКА (6 выражений) ===
  - id: v_q1
    type: question
    topic: "Your Tech World"
    audio: true
    say: "Tell me about the devices you use daily and what you typically do with them. Speak for 30-60 seconds."
    next: v_q2

  - id: v_q2
    type: question
    topic: "Your Favorite Apps"
    audio: true
    say: "Describe your top 2-3 apps and what you use them for. Speak for 30-60 seconds."
    next: v_generate

  - id: v_generate
    type: llm
    model: yandexgpt-pro
    temperature: 0.3
    prompt: prompts.v_generate
    inputs: ["student_context", "answers.v_q1", "answers.v_q2"]
    output: schemas.v_generate
    save_as: vocab_context
    next: v_show

  - id: v_show
    type: vocab_list
    topic: "Your Personalized Vocabulary"
    next: i1

  # === ЧАСТЬ 3: ИНТЕРВЬЮ (6 вопросов с Passive Voice) ===
  - id: i1
    type: question
    topic: "Interview Q1"
    audio: true
    say: "{vocab_context.iq1}"
    next: i2

  - id: i2
    type: question
    topic: "Interview Q2"
    audio: true
    say: "{vocab_context.iq2}"
    next: i3

  - id: i3
    type: question
    topic: "Interview Q3"
    audio: true
    say: "{vocab_context.iq3}"
    next: i4

  - id: i4
    type: question
    topic: "Interview Q4"
    audio: true
    say: "{vocab_context.iq4}"
    next: i5

  - id: i5
    type: question
    topic: "Interview Q5"
    audio: true
    say: "{vocab_context.iq5}"
    next: i6

  - id: i6
    type: question
    topic: "Interview Q6"
    audio: true
    say: "{vocab_context.iq6}"
    after_save_say: "Thank you! Calculating your final score..."
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "vocab_context", "answers"]
    output: schemas.final_grade
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: ["student_context", "answers", "vocab_context", "final_grade"]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: final_grade.profile_notes
    say: "Here is your comprehensive Digital Presentation. Great work!"
    next: done

prompts:
  v_generate: |
    You are an expert English tutor. Based on the student's answers about their devices and apps, generate personalized B2-level vocabulary.
    
    Student's answer about devices:
    {v_q1}
    
    Student's answer about apps:
    {v_q2}
    
    TASK: Select 6 advanced B2-level English expressions/collocations that are semantically related to what the student described.
    
    Return STRICT JSON only:
    {
      "vocab_list": [
        {"expression": "deploy a solution", "definition": "to put a plan or system into action", "example": "The company deployed a new solution to handle customer complaints."},
        {"expression": "authenticate users", "definition": "to verify the identity of users", "example": "The app authenticates users through two-factor authentication."}
      ],
      "iq1": "How is your favorite app ______ (passive) by its developers to deploy new features?",
      "iq2": "What measures are taken to ensure your data is encrypted when you authenticate yourself?",
      "iq3": "How often are your devices backed up when you perform critical operations?",
      "iq4": "Why is it important that personal information is monitored before it is shared online?",
      "iq5": "How are digital boundaries set by you to optimize your screen time?",
      "iq6": "In the future, do you think human-device interaction will be optimized to retrieve information faster?"
    }
    
    Rules:
    - Generate exactly 6 expressions with definitions and examples
    - Interview questions MUST use Passive Voice and incorporate 1-2 expressions from the list
    - All content in ENGLISH

  final_grade: |
    You are an expert English tutor. Evaluate the student's 6 interview answers.
    
    Personalized vocabulary: {vocab_list}
    
    Student answers:
    1: {i1}
    2: {i2}
    3: {i3}
    4: {i4}
    5: {i5}
    6: {i6}
    
    Evaluate on two criteria:
    1. ACCURACY (0-20): grammar (especially Passive Voice), lexical precision
    2. FLUENCY (0-10): coherence, discourse markers, naturalness
    
    Return STRICT JSON only:
    {
      "accuracy": 0,
      "fluency": 0,
      "total": 0,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{"original": "...", "corrected": "...", "explanation": "..."}],
      "profile_notes": {
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."]
      }
    }

  report: |
    You are an expert tutor. Create a final Markdown report.
    
    STUDENT: {student_context}
    PERSONALIZED VOCABULARY: {vocab_list}
    GRADE: {final_grade}
    
    Sections:
    ## 1. Grammar Keys (Passive Voice)
    Brief table of correct answers for the 10 grammar questions.
    
    ## 2. Your Personalized Vocabulary (6 expressions)
    List each expression with definition and example.
    
    ## 3. Interview Transcript (Corrected)
    Rewrite each of the 6 answers as natural B2-level English, demonstrating ideal use of Passive Voice and the 6 expressions.
    
    ## 4. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Grammar | 10 | 10 |
    | Interview Accuracy | {final_grade.accuracy} | 20 |
    | Interview Fluency | {final_grade.fluency} | 10 |
    | **TOTAL** | **{final_grade.total}** | **50** |
    
    ## 5. Detailed Feedback
    **Strengths**: {final_grade.strengths}
    **Areas for Improvement**: {final_grade.improvements}
    
    Output ONLY the Markdown.

schemas:
  v_generate:
    vocab_list: "list"
    iq1: "str"
    iq2: "str"
    iq3: "str"
    iq4: "str"
    iq5: "str"
    iq6: "str"
  final_grade:
    accuracy: "int 0..20"
    fluency: "int 0..10"
    total: "int 0..50"
    strengths: "list"
    improvements: "list"
    errors: "list"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
  report:
    grammar_keys: "str"
    vocab_keys: "str"
    corrected_interview: "list"
    metrics: "str"
    feedback: "str"

templates:
  final_md: |
    # Digital Presentation: {{UNIT_TITLE}}
    Student: {student_name} · Date: {date}
    
    ## 1. Grammar Keys (Passive Voice)
    {report.grammar_keys}
    
    ## 2. Your Personalized Vocabulary (6 expressions)
    {report.vocab_keys}
    
    ## 3. Interview Transcript (Corrected)
    {for i, c in report.corrected_interview}**Q{i}.** {c}{end}
    
    ## 4. Performance Metrics
    {report.metrics}
    
    ## 5. Detailed Feedback
    {report.feedback}
    
  teacher_meta: |
    ### For teacher only
    Raw answers: {answers_raw}
    Tokens: {token_usage}
    Hash: {report_hash}
