meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 4
  est_tokens: "20-30k"
  est_cost_rub: "18-25"
  student_context:
    age: 18
    major: mathematics
    level: "B1 (target: B2)"
    topic: "{{UNIT_TOPIC}}"

settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1
  scoring:
    mc_points_per_item: 1
    llm_score_fields: [dialogue_accuracy, dialogue_fluency, writing_grammar, writing_vocabulary]
    max_by_field:
      dialogue_accuracy: 10
      dialogue_fluency: 10
      writing_grammar: 10
      writing_vocabulary: 10

steps:
  - id: start
    type: gate
    say: |
      Hi! This is a 50-point task based on Module 1 (Technology & Digital Habits).
      Part 1: Grammar Bot Training (10 MCQs, 10 pts)
      Part 2: Dialogue & Personalized Lexis (4 questions, 20 pts)
      Part 3: Interactive Writing (~120 words, 20 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  - id: g1
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The new educational software _______ by the IT department last week."
    options:
      A: "was installed"
      B: "installed"
      C: "has been installing"
      D: "installs"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Relative Clause (whose)"
    question: "The laptop, _______ battery life is exceptional, is highly recommended for students."
    options:
      A: "which"
      B: "whose"
      C: "that"
      D: "who"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "AI tools _______ to assist teachers in creating personalized learning plans."
    options:
      A: "are increasingly used"
      B: "increasingly use"
      C: "have increasingly used"
      D: "are increasingly using"
    correct: A
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Relative Clause (which)"
    question: "The user manual, _______ was included in the box, is very easy to understand."
    options:
      A: "who"
      B: "whose"
      C: "which"
      D: "where"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Future Perfect Passive"
    question: "By the end of the year, the old servers _______ by new, more efficient ones."
    options:
      A: "will replace"
      B: "will have been replaced"
      C: "are replaced"
      D: "have been replacing"
    correct: B
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Relative Clause (whose)"
    question: "This is the programmer _______ code revolutionized the language learning app."
    options:
      A: "who"
      B: "which"
      C: "whose"
      D: "whom"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Relative Clause (which)"
    question: "The data, _______ is stored in the cloud, is completely secure and encrypted."
    options:
      A: "who"
      B: "which"
      C: "whose"
      D: "where"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Continuous Passive"
    question: "A new system update _______ right now, so the computer might restart soon."
    options:
      A: "is being installed"
      B: "installs"
      C: "has installed"
      D: "was being installed"
    correct: A
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Relative Clause (which)"
    question: "The teacher recommended a standard user laptop _______ has at least 8GB of RAM."
    options:
      A: "who"
      B: "whose"
      C: "which"
      D: "where"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Future Simple Passive"
    question: "The workshop on AI in education _______ by Professor Smith next Monday."
    options:
      A: "will be conducted"
      B: "will conduct"
      C: "is conducting"
      D: "has been conducted"
    correct: A
    next: d1

  - id: d1
    type: question
    topic: "Dialogue Q1"
    min_words: 5
    say: |
      💡 Note: For this task, it's preferable to record your speech (use voice input or send audio) to practice fluency. However, written input is also accepted.
      
      Let's discuss your ideal computer! Are you looking for a laptop or a desktop, and what will you primarily use it for?
    next: d2

  - id: d2
    type: question
    topic: "Dialogue Q2"
    min_words: 5
    say: |
      Got it. For those tasks, what specific features are the most important to you? (e.g., processor, RAM, battery life, screen size)
    next: d3

  - id: d3
    type: question
    topic: "Dialogue Q3"
    min_words: 5
    say: |
      Understood. Do you have a specific budget in mind, and how important is portability (weight) to you?
    next: d4

  - id: d4
    type: question
    topic: "Dialogue Q4"
    min_words: 5
    say: |
      Perfect. Based on this, I can suggest looking at models with SSD storage and at least 8GB of RAM. What do you think about this direction?
    next: dialogue_eval

  - id: dialogue_eval
    type: llm
    model: yandexgpt-5-lite
    temperature: 0
    prompt: prompts.dialogue_eval
    inputs: ["student_context", "answers"]
    output: schemas.dialogue_eval
    save_as: dialogue_eval
    next: vocab_gen

  - id: vocab_gen
    type: llm
    model: yandexgpt-5-lite
    temperature: 0.3
    prompt: prompts.vocab_gen
    inputs: ["student_context", "answers"]
    output: schemas.vocab_gen
    save_as: vocab_gen
    next: writing

  - id: writing
    type: question
    topic: "Interactive Writing"
    min_words: 100
    say: |
      Part C: Interactive Writing
      
      Task: Write a recommendation (about 120 words) to an English teacher about buying a basic user laptop.
      
      ⚠️ Mandatory requirements (will be strictly checked):
      - Use Passive Voice at least 2 times
      - Use Relative Clauses at least 2 times
      - Use at least 4 vocabulary items from your personalized list below
      
      Your personalized vocabulary list (use at least 4 items):
      {vocab_gen_vocabulary_md}
      
      Write your text below. When finished, send it to me.
    next: writing_eval

  - id: writing_eval
    type: llm
    model: yandexgpt-5-lite
    temperature: 0
    prompt: prompts.writing_eval
    inputs: ["student_context", "answers", "vocab_gen"]
    output: schemas.writing_eval
    save_as: writing_eval
    next: finish_gate

  - id: finish_gate
    type: gate
    say: |
      Your written task has been checked. If you're ready to receive the final Assessment Artifact with scores for all three parts to send to your teacher, please press the button below.
    buttons: ["Finish!"]
    next: report

  - id: report
    type: llm
    model: yandexgpt-5-lite
    temperature: 0
    prompt: prompts.report
    inputs: ["student_context", "answers", "dialogue_eval", "vocab_gen", "writing_eval"]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: report.profile_notes
      say: "Here is your personalized feedback. Great work!"
    next: done

prompts:
  dialogue_eval: |
    You are an expert English tutor. Evaluate the student's dialogue responses about their ideal computer.
    Student: 18 y.o., math major, B1 targeting B2.
    
    Dialogue responses:
    Q1 (laptop/desktop, primary use): {d1}
    Q2 (important features): {d2}
    Q3 (budget, portability): {d3}
    Q4 (opinion on suggestion): {d4}
    
    Evaluate on two criteria. Pick the band by its description first, then a score inside it.
    
    DIALOGUE ACCURACY (0-10):
    9-10: excellent grammar, precise vocabulary, coherent
    7-8: good grammar with minor errors, appropriate vocabulary
    5-6: noticeable errors but understandable, basic vocabulary
    3-4: frequent errors impeding understanding
    0-2: very poor accuracy
    
    DIALOGUE FLUENCY (0-10):
    9-10: natural, confident, smooth flow
    7-8: mostly natural with some hesitation
    5-6: choppy but communicative
    3-4: many pauses and false starts
    0-2: very disjointed
    
    Return STRICT JSON only:
    {{
      "dialogue_accuracy": 0,
      "dialogue_fluency": 0,
      "dialogue_feedback": "Brief feedback on strengths and 2-3 key errors with corrections",
      "corrected_dialogue": "Corrected version of student's responses",
      "errors": [{{"original": "...", "corrected": "...", "explanation": "..."}}]
    }}
    
    Rules:
    - Do NOT output a total score — the system sums it up itself
    - errors: 2-3 items from the dialogue, original — verbatim quote
    - All feedback in ENGLISH

  vocab_gen: |
    You are an expert English tutor. Generate a personalized vocabulary list based on the student's dialogue about their ideal computer.
    Student: 18 y.o., math major, B1 targeting B2.
    
    Dialogue responses:
    Q1: {d1}
    Q2: {d2}
    Q3: {d3}
    Q4: {d4}
    
    Generate 6-8 B2/C1 vocabulary items related to technology/computer purchase.
    For each item, provide:
    - word: the word/collocation
    - translation: natural Russian equivalent
    - definition: strict definition in Oxford Learner's Dictionaries style
    - example: authentic example sentence
    
    Also generate a markdown-formatted list for display in the next task.
    
    Return STRICT JSON only:
    {{
      "vocabulary_list": [
        {{"word": "...", "translation": "...", "definition": "...", "example": "..."}}
      ],
      "vocabulary_md": "Markdown-formatted list with format:\n**Word** — Translation\nDefinition: ...\nExample: ..."
    }}
    
    Rules:
    - vocabulary_md should be readable markdown
    - All definitions and examples in ENGLISH
    - Translations in RUSSIAN

  writing_eval: |
    You are an expert English tutor. Evaluate the student's writing task.
    Student: 18 y.o., math major, B1 targeting B2.
    
    Task: Write a recommendation (~120 words) to an English teacher about buying a basic user laptop.
    Constraints:
    - Use Passive Voice at least 2 times
    - Use Relative Clauses at least 2 times
    - Use at least 4 vocabulary items from the personalized list
    
    Personalized vocabulary list:
    {vocab_gen_vocabulary_md}
    
    Student's text:
    {writing}
    
    Evaluate on two criteria. Pick the band by its description first, then a score inside it.
    
    WRITING GRAMMAR (0-10):
    9-10: excellent grammar, Passive Voice used correctly 2+ times, Relative Clauses 2+ times
    7-8: good grammar with minor errors, constraints mostly met
    5-6: noticeable errors, constraints partially met
    3-4: frequent errors, constraints not met
    0-2: very poor grammar
    
    WRITING VOCABULARY (0-10):
    9-10: excellent vocabulary range, 4+ items from list used naturally
    7-8: good vocabulary, 3-4 items from list used
    5-6: basic vocabulary, 2-3 items from list used
    3-4: limited vocabulary, 1-2 items from list used
    0-2: very poor vocabulary
    
    Check constraints:
    - Count Passive Voice instances
    - Count Relative Clauses instances
    - List vocabulary items used from personalized list
    
    Return STRICT JSON only:
    {{
      "writing_grammar": 0,
      "writing_vocabulary": 0,
      "feedback_text": "Detailed feedback including:\n1. Task Achievement (word count ~120, topic adherence)\n2. Grammar Constraints (found X Passive Voice, Y Relative Clauses)\n3. Vocabulary (used N items from list, list them)\n4. Corrections (if any)\n5. Message: 'Your written task has been checked. If you're ready to receive the final Assessment Artifact, press Finish!'",
      "constraint_check": {{
        "passive_count": 0,
        "relative_clause_count": 0,
        "vocabulary_used": ["...", "..."]
      }},
      "errors": [{{"original": "...", "corrected": "...", "explanation": "..."}}]
    }}
    
    Rules:
    - Do NOT output a total score — the system sums it up itself
    - errors: 2-3 items from the text, original — verbatim quote
    - feedback_text must include the Finish! message
    - All feedback in ENGLISH

  report: |
    You are an expert English tutor. Generate a final assessment artifact for the teacher.
    Student: 18 y.o., math major, B1 targeting B2.
    
    GRAMMAR TEST (Part A): {mc_score}/10
    Topics answered incorrectly: {mc_wrong_topics}
    
    DIALOGUE (Part B):
    Accuracy: {dialogue_eval_dialogue_accuracy}/10
    Fluency: {dialogue_eval_dialogue_fluency}/10
    Feedback: {dialogue_eval_dialogue_feedback}
    
    PERSONALIZED VOCABULARY LIST:
    {vocab_gen_vocabulary_md}
    
    WRITING (Part C):
    Grammar: {writing_eval_writing_grammar}/10
    Vocabulary: {writing_eval_writing_vocabulary}/10
    Feedback: {writing_eval_feedback_text}
    Constraint check: {writing_eval_constraint_check}
    
    Student's writing:
    {writing}
    
    Generate a markdown-formatted assessment artifact following this EXACT structure:
    
    # АРТЕФАКТ: ОЦЕНКА МОДУЛЯ 1 (ПОВТОРЕНИЕ)
    
    ## Часть A. Grammar Bot Training (Макс. 10 баллов)
    *(List student's answers for all 10 questions, correct answers, and brief explanations. 1 point per correct answer. Total: X/10)*
    
    ## Часть B. Dialogue & Personalized Lexis (Макс. 20 баллов)
    **1. Corrected Dialogue Script:**
    *(Brief analysis of 2-3 main errors from the dialogue with corrections)*
    
    **2. Personalized Vocabulary List:**
    *(Full list of 6-8 items in format: Word / Translation / Definition / Example)*
    
    **Оценка:** Accuracy: X/10, Fluency: Y/10. Итого: Z/20.
    
    ## Часть C. Interactive Writing (Макс. 20 баллов)
    **Текст студента:**
    *(Quote of student's text)*
    
    **Feedback & Constraint Check:**
    - Task Achievement: (comment on word count ~120 and topic)
    - Grammar Constraints: (confirmation: found X Passive Voice, Y Relative Clauses)
    - Vocabulary: (confirmation: used N items from personalized list, list them)
    - Corrections: (corrected errors if any)
    
    **Оценка:** Grammar & Accuracy: X/10, Vocabulary & Task Fulfillment: Y/10. Итого: Z/20.
    
    ---
    
    ### ИТОГОВАЯ ОЦЕНКА: [Total] / 50
    
    *Professional Tutor's Note: Отличная работа над повторением материала! Ваша сильная сторона: [указать]. Зона для роста: [указать].*
    
    Return STRICT JSON only:
    {{
      "feedback_text": "Markdown artifact text following the structure above",
      "profile_notes": {{
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."],
        "grammar_gaps": ["..."]
      }}
    }}
    
    Rules:
    - feedback_text must be valid markdown
    - Calculate total score: mc_score + dialogue_accuracy + dialogue_fluency + writing_grammar + writing_vocabulary
    - All content in RUSSIAN except vocabulary definitions/examples
    - Do NOT include teacher meta information (tokens, flags, hash) — the system adds it separately

schemas:
  dialogue_eval:
    dialogue_accuracy: "int 0..10"
    dialogue_fluency: "int 0..10"
    dialogue_feedback: "str"
    corrected_dialogue: "str"
    errors: "list"
  
  vocab_gen:
    vocabulary_list: "list"
    vocabulary_md: "str"
  
  writing_eval:
    writing_grammar: "int 0..10"
    writing_vocabulary: "int 0..10"
    feedback_text: "str"
    constraint_check: "dict"
    errors: "list"
  
  report:
    feedback_text: "str (markdown artifact)"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
      grammar_gaps: "list"

templates:
  final_md: |
    {report_feedback_text}
  
  teacher_meta: |
    ### For teacher only
    Raw answers: {answers_raw}
    Tokens: {token_usage}
    Hash: {report_hash}