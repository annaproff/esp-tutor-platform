meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 2
  est_tokens: "10-12k"
  est_cost_rub: "8-12"
student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2)"
  topic: "{{UNIT_TOPIC}}"
settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1
steps:
  - id: start
    type: gate
    say: |
      Hi! This is a 50-point task.
      Part 1: Grammar - Passive Voice (10 MCQs, 10 pts)
      Part 2: Tech Habits Interview (6 questions, 40 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  # === ЧАСТЬ 1: ГРАММАТИКА (10 баллов) ===
  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: i1

  # === ЧАСТЬ 2: ИНТЕРВЬЮ (40 баллов) ===
  - id: i1
    type: question
    topic: "Screen Time"
    audio: true
    say: "How many hours a day do you typically spend on screens, and what is your most time-consuming digital activity?"
    next: i2

  - id: i2
    type: question
    topic: "Cybersecurity"
    audio: true
    say: "What specific measures do you take to protect your devices and online accounts from cyber threats (e.g., passwords, two-factor authentication)?"
    next: i3

  - id: i3
    type: question
    topic: "Personal Data Protection"
    audio: true
    say: "How carefully do you manage your personal data when installing new apps, accepting cookies, or using social media platforms?"
    next: i4

  - id: i4
    type: question
    topic: "Digital Boundaries"
    audio: true
    say: "Did you experience any parental control over your tech use growing up, and how do you set digital boundaries for yourself now as a young adult?"
    next: i5

  - id: i5
    type: question
    topic: "Tech & Studies"
    audio: true
    say: "As a math student, how does technology impact your focus and productivity when solving complex problems or studying? Does it help or distract you more?"
    next: i6

  - id: i6
    type: question
    topic: "Digital Detox & Future"
    audio: true
    say: "Do you ever practice a 'digital detox', and how do you imagine your relationship with technology changing in the next 5 years?"
    after_save_say: "Thank you! Give me a moment to review your answers and calculate your final score."
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "answers"]
    output: schemas.final_grade
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: ["student_context", "answers", "final_grade"]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: final_grade.profile_notes
    say: "Here is your comprehensive Digital Presentation. Great work!"
    next: done

prompts:
  final_grade: |
    You are an expert English tutor. Evaluate the student's 6 interview answers about tech habits.
    Student is 18 years old, math major, B1 level targeting B2.
    
    Student answers:
    1 (Screen Time): {i1}
    2 (Cybersecurity): {i2}
    3 (Data Protection): {i3}
    4 (Digital Boundaries): {i4}
    5 (Tech & Studies): {i5}
    6 (Digital Detox): {i6}
    
    Evaluate on two criteria:
    1. ACCURACY (0-25): grammar (tenses, articles, prepositions), lexical precision, B2 vocabulary usage
    2. FLUENCY (0-15): coherence, discourse markers, naturalness, length of answers
    
    Return STRICT JSON only:
    {
      "accuracy": 0,
      "fluency": 0,
      "total": 0,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{"original": "...", "corrected": "...", "explanation": "..."}],
      "profile_notes": {
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."],
        "grammar_gaps": ["..."]
      }
    }
    Rules:
    - errors: exactly 2-3 items, original — verbatim quote from answers
    - strengths/improvements: 2-3 items each
    - All feedback in ENGLISH

  report: |
    You are an expert tutor. Create a final Markdown report.
    STUDENT: {student_context}
    STUDENT ANSWERS:
    1: {i1}
    2: {i2}
    3: {i3}
    4: {i4}
    5: {i5}
    6: {i6}
    GRADE: {final_grade}
    
    Sections:
    ## 1. Grammar Keys (Passive Voice)
    Brief table of correct answers for the 10 grammar questions (g1-g10) with explanations for 2-3 tricky cases.
    
    ## 2. Interview Transcript (Corrected)
    Rewrite each of the 6 interview answers as natural B2-level English, preserving meaning and demonstrating ideal grammar and vocabulary.
    
    ## 3. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Grammar (Passive Voice) | 10 | 10 |
    | Interview Accuracy | {final_grade.accuracy} | 25 |
    | Interview Fluency | {final_grade.fluency} | 15 |
    | **TOTAL** | **{final_grade.total}** | **50** |
    
    ## 4. Detailed Feedback
    **Strengths**: {final_grade.strengths}
    **Areas for Improvement**: {final_grade.improvements}
    
    ## 5. Personalized Vocabulary Upgrade
    Based on the student's answers, suggest 6-8 advanced B2-level words/collocations related to technology that the student should learn. For each word provide:
    - Word/phrase
    - Definition (in English)
    - Example sentence
    Focus on words that would naturally fit the topics discussed (screen time, cybersecurity, data privacy, digital boundaries, etc.).
    
    Output ONLY the Markdown.

schemas:
  final_grade:
    accuracy: "int 0..25"
    fluency: "int 0..15"
    total: "int 0..50"
    strengths: "list"
    improvements: "list"
    errors: "list"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
      grammar_gaps: "list"
  report:
    grammar_keys: "str"
    corrected_interview: "list"
    metrics: "str"
    feedback: "str"
    vocab_upgrade: "list"

templates:
  final_md: |
    # Digital Presentation: {{UNIT_TITLE}}
    Student: {student_name} · Date: {date}
    
    ## 1. Grammar Keys (Passive Voice)
    {report.grammar_keys}
    
    ## 2. Interview Transcript (Corrected)
    {for i, c in report.corrected_interview}**Q{i}.** {c}{end}
    
    ## 3. Performance Metrics
    {report.metrics}
    
    ## 4. Detailed Feedback
    {report.feedback}
    
    ## 5. Personalized Vocabulary Upgrade
    {for v in report.vocab_upgrade}
    **{v.word}** — {v.definition}
    *Example: {v.example}*
    {end}
    
  teacher_meta: |
    ### For teacher only
    Raw answers: {answers_raw}
    Tokens: {token_usage}
    Hash: {report_hash}
