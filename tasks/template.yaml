meta:
  id: "unit_{{UNIT_NUMBER}}"
  title: "{{UNIT_TITLE}}"
  max_score: 50
  llm_calls: 4
  est_tokens: "15-20k"
  est_cost_rub: "12-18"
student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2)"
  topic: "{{UNIT_TOPIC}}"
settings:
  answers:
    language: en
    min_words: 1
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1
steps:
  - id: start
    type: gate
    say: |
      Hi! This is a comprehensive 50-point task.
      Part 1: Grammar - Passive Voice (10 MCQs, 10 pts)
      Part 2: Tech Preferences Survey (6 questions, no right answers)
      Part 3: Personalized Interview (6 audio questions, 30 pts)
      Press Start when you're ready.
    buttons: ["Start"]
    next: g1

  # === ЧАСТЬ 1: ГРАММАТИКА (10 вопросов) ===
  - id: g1
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "The new security patch ______ by the development team every month."
    options:
      A: "is deployed"
      B: "was deployed"
      C: "has been deployed"
      D: "deploys"
    correct: A
    next: g2

  - id: g2
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The database ______ last night during the maintenance window."
    options:
      A: "is backed up"
      B: "was backed up"
      C: "has been backed up"
      D: "backed up"
    correct: B
    next: g3

  - id: g3
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Several vulnerabilities ______ in the system so far."
    options:
      A: "are discovered"
      B: "were discovered"
      C: "have been discovered"
      D: "discovered"
    correct: C
    next: g4

  - id: g4
    type: multiple_choice
    topic: "Past Perfect Passive"
    question: "The server ______ before the attack occurred."
    options:
      A: "is compromised"
      B: "was compromised"
      C: "had been compromised"
      D: "has been compromised"
    correct: C
    next: g5

  - id: g5
    type: multiple_choice
    topic: "Modal Passive"
    question: "All user data ______ encrypted according to the new policy."
    options:
      A: "must be"
      B: "must"
      C: "must been"
      D: "must to be"
    correct: A
    next: g6

  - id: g6
    type: multiple_choice
    topic: "Reporting Verb Passive"
    question: "The algorithm ______ to improve search accuracy by 40%."
    options:
      A: "believes"
      B: "is believed"
      C: "is believed to"
      D: "believed to"
    correct: C
    next: g7

  - id: g7
    type: multiple_choice
    topic: "Passive with Infinitive"
    question: "The software update needs ______ before Friday."
    options:
      A: "to install"
      B: "to be installed"
      C: "installing"
      D: "be installed"
    correct: B
    next: g8

  - id: g8
    type: multiple_choice
    topic: "Present Simple Passive"
    question: "User passwords ______ in a secure database."
    options:
      A: "store"
      B: "are stored"
      C: "stored"
      D: "have stored"
    correct: B
    next: g9

  - id: g9
    type: multiple_choice
    topic: "Past Simple Passive"
    question: "The firewall ______ by the IT team yesterday."
    options:
      A: "configures"
      B: "is configured"
      C: "was configured"
      D: "configured"
    correct: C
    next: g10

  - id: g10
    type: multiple_choice
    topic: "Present Perfect Passive"
    question: "Three major bugs ______ in the latest release."
    options:
      A: "fix"
      B: "are fixed"
      C: "were fixed"
      D: "have been fixed"
    correct: D
    next: survey_generate

  # === ЧАСТЬ 2: АНКЕТА (6 вопросов, только текст) ===
  - id: survey_generate
    type: llm
    model: yandexgpt-pro
    temperature: 0.4
    prompt: prompts.survey_generate
    inputs: ["student_context"]
    output: schemas.survey_generate
    save_as: survey_context
    next: s1

  - id: s1
    type: question
    topic: "Survey Q1"
    audio: false
    say: "{survey_context.q1}"
    next: s2

  - id: s2
    type: question
    topic: "Survey Q2"
    audio: false
    say: "{survey_context.q2}"
    next: s3

  - id: s3
    type: question
    topic: "Survey Q3"
    audio: false
    say: "{survey_context.q3}"
    next: s4

  - id: s4
    type: question
    topic: "Survey Q4"
    audio: false
    say: "{survey_context.q4}"
    next: s5

  - id: s5
    type: question
    topic: "Survey Q5"
    audio: false
    say: "{survey_context.q5}"
    next: s6

  - id: s6
    type: question
    topic: "Survey Q6"
    audio: false
    say: "{survey_context.q6}"
    after_save_say: "Great! Now let's move to the interview. You'll be able to record audio answers."
    next: interview_generate

  # === ЧАСТЬ 3: ИНТЕРВЬЮ (6 вопросов, аудио + текст) ===
  - id: interview_generate
    type: llm
    model: yandexgpt-pro
    temperature: 0.3
    prompt: prompts.interview_generate
    inputs: ["student_context", "survey_context", "answers.s1", "answers.s2", "answers.s3", "answers.s4", "answers.s5", "answers.s6"]
    output: schemas.interview_generate
    save_as: interview_context
    next: i1

  - id: i1
    type: question
    topic: "Interview Q1"
    audio: true
    say: "{interview_context.iq1}"
    next: i2

  - id: i2
    type: question
    topic: "Interview Q2"
    audio: true
    say: "{interview_context.iq2}"
    next: i3

  - id: i3
    type: question
    topic: "Interview Q3"
    audio: true
    say: "{interview_context.iq3}"
    next: i4

  - id: i4
    type: question
    topic: "Interview Q4"
    audio: true
    say: "{interview_context.iq4}"
    next: i5

  - id: i5
    type: question
    topic: "Interview Q5"
    audio: true
    say: "{interview_context.iq5}"
    next: i6

  - id: i6
    type: question
    topic: "Interview Q6"
    audio: true
    say: "{interview_context.iq6}"
    after_save_say: "Thank you! Calculating your final score..."
    next: final_grade

  - id: final_grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.final_grade
    inputs: ["student_context", "interview_context", "answers"]
    output: schemas.final_grade
    save_as: final_grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: ["student_context", "answers", "interview_context", "final_grade"]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      update_profile: final_grade.profile_notes
    say: "Here is your comprehensive Digital Presentation. Great work!"
    next: done

prompts:
  survey_generate: |
    You are an expert English tutor. Generate a 6-question survey to understand the student's technology preferences and habits.
    
    Student profile: {student_context}
    
    TASK: Create 6 engaging questions about:
    - Devices they use (smartphone, laptop, tablet, smartwatch, etc.)
    - Apps and software they prefer
    - How they use technology for studies/work
    - Their attitude toward cybersecurity and privacy
    - Screen time and digital habits
    - Future technology interests
    
    Questions should be open-ended to encourage detailed answers.
    Use natural, conversational English at B1-B2 level.
    
    Return STRICT JSON only:
    {
      "q1": "What devices do you use daily, and which one is most important to you?",
      "q2": "Name your top 3 apps and explain what you use them for.",
      "q3": "How does technology help you with your studies or work?",
      "q4": "What measures do you take to protect your personal data online?",
      "q5": "How many hours a day do you spend on screens, and do you try to limit it?",
      "q6": "What new technology are you most excited about in the next 5 years?"
    }

  interview_generate: |
    You are an expert English tutor. Based on the student's survey answers, generate 6 personalized interview questions.
    
    Student's survey answers:
    Q1: {s1}
    Q2: {s2}
    Q3: {s3}
    Q4: {s4}
    Q5: {s5}
    Q6: {s6}
    
    TASK:
    1. Analyze the student's answers to identify 6 advanced B2-level vocabulary items (expressions, collocations) that are relevant to their interests and habits.
    2. Create 6 interview questions that:
       - Use Passive Voice (to practice grammar from Part 1)
       - Naturally incorporate the 6 vocabulary items (one per question)
       - Are personalized based on what the student said in the survey
       - Encourage extended, thoughtful answers
    
    Return STRICT JSON only:
    {
      "vocab_used": ["deploy a solution", "authenticate users", "encrypt data", "monitor activity", "optimize performance", "retrieve information"],
      "iq1": "You mentioned using [specific app/device]. How is it ______ (passive) by developers to ______ (vocab item 1)?",
      "iq2": "When you ______ (vocab item 2), what measures are taken to ensure your data is ______ (passive)?",
      "iq3": "How often are your devices ______ (passive) when you need to ______ (vocab item 3)?",
      "iq4": "Why is it important that personal information is ______ (passive) before it is ______ (vocab item 4)?",
      "iq5": "How are digital boundaries ______ (passive) by you to ______ (vocab item 5)?",
      "iq6": "In the future, do you think technology will be ______ (passive) to ______ (vocab item 6)?"
    }
    
    Rules:
    - Questions MUST use Passive Voice
    - Each question should include one vocabulary item from the list
    - Questions should reference specific details from the student's survey answers
    - All content in ENGLISH

  final_grade: |
    You are an expert English tutor. Evaluate the student's 6 interview answers.
    
    Vocabulary used in questions: {vocab_used}
    
    Student answers:
    1: {i1}
    2: {i2}
    3: {i3}
    4: {i4}
    5: {i5}
    6: {i6}
    
    Evaluate on two criteria:
    1. ACCURACY (0-20): grammar (especially Passive Voice), lexical precision, attempt to use the vocabulary from questions
    2. FLUENCY (0-10): coherence, discourse markers, naturalness, length of answers
    
    Return STRICT JSON only:
    {
      "accuracy": 0,
      "fluency": 0,
      "total": 0,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{"original": "...", "corrected": "...", "explanation": "..."}],
      "profile_notes": {
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."]
      }
    }

  report: |
    You are an expert tutor. Create a final Markdown report.
    
    STUDENT: {student_context}
    SURVEY ANSWERS:
    Q1: {s1}
    Q2: {s2}
    Q3: {s3}
    Q4: {s4}
    Q5: {s5}
    Q6: {s6}
    
    INTERVIEW QUESTIONS:
    Q1: {iq1}
    Q2: {iq2}
    Q3: {iq3}
    Q4: {iq4}
    Q5: {iq5}
    Q6: {iq6}
    
    GRADE: {final_grade}
    
    Sections:
    ## 1. Grammar Keys (Passive Voice)
    Brief table of correct answers for the 10 grammar questions.
    
    ## 2. Survey Responses
    List all 6 survey questions with student's answers.
    
    ## 3. Interview Transcript (Corrected)
    Rewrite each of the 6 interview answers as natural B2-level English, demonstrating ideal use of Passive Voice and the vocabulary from questions.
    
    ## 4. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Grammar | 10 | 10 |
    | Interview Accuracy | {final_grade.accuracy} | 20 |
    | Interview Fluency | {final_grade.fluency} | 10 |
    | **TOTAL** | **{final_grade.total}** | **50** |
    
    ## 5. Detailed Feedback
    **Strengths**: {final_grade.strengths}
    **Areas for Improvement**: {final_grade.improvements}
    
    Output ONLY the Markdown.

schemas:
  survey_generate:
    q1: "str"
    q2: "str"
    q3: "str"
    q4: "str"
    q5: "str"
    q6: "str"
  interview_generate:
    vocab_used: "list"
    iq1: "str"
    iq2: "str"
    iq3: "str"
    iq4: "str"
    iq5: "str"
    iq6: "str"
  final_grade:
    accuracy: "int 0..20"
    fluency: "int 0..10"
    total: "int 0..50"
    strengths: "list"
    improvements: "list"
    errors: "list"
    profile_notes:
      estimated_level: "str"
      vocabulary_gaps: "list"
  report:
    grammar_keys: "str"
    survey_responses: "str"
    corrected_interview: "list"
    metrics: "str"
    feedback: "str"

templates:
  final_md: |
    # Digital Presentation: {{UNIT_TITLE}}
    Student: {student_name} · Date: {date}
    
    ## 1. Grammar Keys (Passive Voice)
    {report.grammar_keys}
    
    ## 2. Survey Responses
    {report.survey_responses}
    
    ## 3. Interview Transcript (Corrected)
    {for i, c in report.corrected_interview}**Q{i}.** {c}{end}
    
    ## 4. Performance Metrics
    {report.metrics}
    
    ## 5. Detailed Feedback
    {report.feedback}
    
  teacher_meta: |
    ### For teacher only
    Raw answers: {answers_raw}
    Tokens: {token_usage}
    Hash: {report_hash}
