meta:
  id: task_vocabulary_tech
  title: "Personalized Technology Vocabulary"
  max_score: 30
  llm_calls: 3
  est_tokens: "10-12k"
  est_cost_rub: "8-12"

student_context:
  age: 18
  major: mathematics
  level: "B1 (target: B2-C1 vocabulary)"
  topic: "Technology in Everyday Life"

settings:
  answers:
    language: en
    min_words: 15
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1

steps:
  - id: start
    type: gate
    say: |
      Hi! This task will help you build personalized tech vocabulary.
      I'll ask you 3 questions about your devices and apps, then suggest
      6-8 advanced words based on your answers.
      Press Start when you're ready.
    buttons: ["Start"]
    next: q1

  - id: q1
    type: question
    topic: "Devices"
    say: "Which devices do you use in your everyday life?"
    save_as: answers.q1
    next: q2

  - id: q2
    type: question
    topic: "Operations"
    say: "What particular operations do you perform with them?"
    save_as: answers.q2
    next: q3

  - id: q3
    type: question
    topic: "Top Apps"
    say: "Name your top three apps and illustrate what you do in them."
    save_as: answers.q3
    next: vocab_input

  - id: vocab_input
    type: question
    topic: "Your Examples"
    say: |
      Here is your personalized vocabulary list (generated by AI):
      {vocabulary_list}

      Now write your own example sentences for 3-4 units from this list.
      Write them in the format: "word/phrase — your example sentence"
    save_as: answers.vocab_examples
    next: grade

  - id: grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.grade
    inputs: [student_context, rubric, answers, profile, vocabulary_list]
    output: schemas.grade
    checks:
      - "accuracy: int 0..20"
      - "fluency: int 0..10"
      - "errors: 2-3 items"
    on_check_fail: "retry 1 time"
    compute: "total = accuracy + fluency"
    save_as: grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: [student_context, answers, grade, vocabulary_list]
    output: schemas.report
    checks:
      - "corrected_monologue: 1 item"
      - "vocabulary_list: 6-8 items"
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      write_row: "results_table"
      update_profile: grade.profile_notes
    say: "Here is your Digital Presentation. Great work!"
    next: done

rubric:
  accuracy:
    "17-20": "Accurate use of new vocabulary; no grammatical errors in examples"
    "13-16": "Minor errors in examples; vocabulary used mostly correctly"
    "9-12": "Several errors; some vocabulary misused"
    "5-8": "Frequent errors; vocabulary often used incorrectly"
    "0-4": "Examples unclear; vocabulary not demonstrated"
  fluency:
    "9-10": "Natural, contextual examples; good collocations"
    "7-8": "Examples understandable but slightly unnatural"
    "5-6": "Simple examples; limited context"
    "3-4": "Fragmented examples"
    "0-2": "Examples missing or incomprehensible"

prompts:
  grade: |
    Ты экспертный тьютор по английскому языку. Оцени примеры предложений студента
    с использованием новой лексики по теме технологий.

    {profile_block}

    КОНТЕКСТ СТУДЕНТА: {student_context}
    СПИСОК ЛЕКСИКИ: {vocabulary_list}
    ПРИМЕРЫ СТУДЕНТА: {vocab_examples}

    Оценивай по двум критериям:
    1. ACCURACY (/20): правильное использование новой лексики, грамматика
    2. FLUENCY (/10): естественность, контекст, коллокации

    Верни СТРОГО JSON без markdown:
    {{
      "accuracy": <int 0-20>,
      "fluency": <int 0-10>,
      "total": <int 0-30>,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{{"original": "...", "corrected": "...", "explanation": "..."}}],
      "profile_notes": {{
        "recurring_errors": ["..."],
        "resolved_since_last": ["..."],
        "estimated_level": "B1 | B1+ | B2",
        "vocabulary_gaps": ["..."]
      }}
    }}

    Правила:
    - errors: ровно 2-3 пункта
    - strengths/improvements: по 2-3 пункта
    - profile_notes: отметь прогресс в использовании продвинутой лексики
    - Весь фидбек на АНГЛИЙСКОМ

  report: |
    Ты экспертный тьютор. Сформируй Digital Presentation на основе:

    ИСХОДНЫЕ ОТВЕТЫ СТУДЕНТА (о устройствах и приложениях):
    {q1}
    {q2}
    {q3}

    СПИСОК ЛЕКСИКИ (6-8 единиц):
    {vocabulary_list}

    ОЦЕНКА:
    {grade_json}

    Сформируй Markdown-отчет со следующими разделами:

    ## 1. Corrected Monologue Script
    Исправь и улучши исходные ответы студента (q1, q2, q3) — сделай их
    более естественными на уровне B2, сохранив смысл.

    ## 2. Personalized Vocabulary List
    Для каждой единицы из списка:
    - **Word/Phrase**
    - Русский эквивалент
    - Definition (в стиле Oxford Learner's Dictionaries)
    - Example (если студент использовал — его исправленный пример,
      иначе — корпусный пример Merriam-Webster)

    ## 3. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Accuracy | {accuracy} | 20 |
    | Fluency | {fluency} | 10 |
    | **Total** | **{total}** | **30** |

    ## 4. Detailed Feedback
    **Strengths**: {strengths}
    **Areas for Improvement**: {improvements}

    ## 5. Personalized Vocabulary Upgrade
    3-5 дополнительных продвинутых слов по теме, которые студенту
    стоит изучить дальше.

    Output ONLY the Markdown.

schemas:
  grade:
    accuracy: "int 0..20"
    fluency: "int 0..10"
    total: "int 0..30"
    strengths: "[str] — 2-3 items"
    improvements: "[str] — 2-3 items"
    errors: "[{{original, corrected, explanation}}] — 2-3 items"
    profile_notes:
      recurring_errors: "[str]"
      resolved_since_last: "[str]"
      estimated_level: "B1 | B1+ | B2"
      vocabulary_gaps: "[str]"
  report:
    corrected_monologue: "str"
    vocabulary_list: "[{{word, translation, definition, example}}] — 6-8 items"
    additional_vocab: "[{{word, definition, example}}] — 3-5 items"

templates:
  final_md: |
    # Digital Presentation: Personalized Tech Vocabulary

    Student: {student_name} · Date: {date}

    ## 1. Corrected Monologue Script
    {corrected_monologue}

    ## 2. Personalized Vocabulary List
    {for v in vocabulary_list}
    ### {v.word}
    - **Translation:** {v.translation}
    - **Definition:** {v.definition}
    - **Example:** {v.example}
    {end}

    ## 3. Performance Metrics
    | Criterion | Score |
    |-----------|-------|
    | Accuracy | {accuracy} / 20 |
    | Fluency | {fluency} / 10 |
    | **Total** | **{total} / 30** |

    ## 4. Detailed Feedback
    **Strengths**
    {for s in strengths}- {s}{end}

    **Areas for Improvement**
    {for i in improvements}- {i}{end}

    ## 5. Personalized Vocabulary Upgrade
    {for v in additional_vocab}- **{v.word}** — {v.definition}
      *Example: {v.example}*{end}

    ---
    {closing}

  teacher_meta: |
    ### Служебное (только для преподавателя)
    Исходные ответы: {answers_raw}
    Флаги: {flags}
    Токены: {token_usage}
    Хеш: {report_hash}
