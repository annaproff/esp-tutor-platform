meta:
  id: task_reading_mikolov
  title: "Mathematical Foundations of Word Representations"
  max_score: 30
  llm_calls: 2
  est_tokens: "12-15k"

student_context:
  major: mathematics
  level: "B1-B2"
  topic: "Word Representations, Skip-gram, Negative Sampling"

settings:
  answers:
    language: en
    min_words: 10
    russian_detect: "cyrillic > 30%"
  attempts:
    max: 1

steps:
  - id: start
    type: gate
    say: |
      Hi! This task is about the mathematical foundations of word representations.
      We'll read an academic paper by Mikolov et al. (2013) and discuss it.
      Press Start when you're ready.
    buttons: ["Start"]
    next: warmup

  - id: warmup
    type: question
    topic: "Warm-up Discussion"
    say: |
      Look at the vector formula:
      `vec(King) - vec(Man) + vec(Woman) ≈ vec(Queen)`

      Answer briefly:
      1. How is it possible to do arithmetic operations with words?
      2. What mathematical concepts are needed to train a model to understand this?
      3. Have you ever heard of the Skip-gram model or word embeddings?
    save_as: answers.warmup
    next: vocab_matching

  - id: vocab_matching
    type: matching
    topic: "Vocabulary Matching"
    say: |
      Match the terms (1-8) with their definitions (A-H).
      Send your answers in format: 1-D, 2-H, ...

      Terms:
      1. Distributed representations
      2. Skip-gram model
      3. Hierarchical softmax
      4. Negative sampling
      5. Subsampling of frequent words
      6. Vector compositionality
      7. Analogical reasoning
      8. Cosine distance

      Definitions:
      A. A method to speed up training by ignoring the most common words with a certain probability.
      B. The mathematical property where adding two word vectors creates a new meaningful vector.
      C. A way of measuring the similarity between two vectors by calculating the cosine of the angle between them.
      D. Representing words as dense vectors in a continuous space, capturing semantic and syntactic relationships.
      E. An efficient approximation of the standard softmax function using a binary tree structure.
      F. A simplified training method that teaches the model to distinguish the target word from random noise words.
      G. The ability to solve problems like "Germany is to Berlin as France is to X" using vector arithmetic.
      H. A neural network architecture that predicts surrounding context words given a center word.
    correct:
      1: D
      2: H
      3: E
      4: F
      5: A
      6: B
      7: G
      8: C
    save_as: answers.vocab_matching
    next: scanning

  - id: scanning
    type: question
    topic: "Scanning the Text"
    say: |
      Find the following specific information in the article:
      1. The year when the earliest use of word representations dates back to.
      2. The approximate number of words an optimized single-machine implementation can train in one day.
      3. The mathematical formula used to calculate the probability of discarding a word during subsampling.
      4. The typical value of the chosen threshold t in the subsampling formula.
      5. The dimensionality of the vectors used in the experiments summarized in Table 1.
    save_as: answers.scanning
    next: reading_detail

  - id: reading_detail
    type: question
    topic: "Reading for Detail"
    say: |
      Decide if the statements are True, False, or Not Given.
      If False, correct the statement using information from the text.

      1. The basic Skip-gram formulation uses a softmax function, which is highly practical because the cost of computing it is very low.
      2. Hierarchical softmax reduces the computational cost by evaluating only about log2(W) nodes instead of all W output nodes.
      3. Negative Sampling requires both the samples and the exact numerical probabilities of the noise distribution to work.
      4. The unigram distribution raised to the 3/4th power was found to be the worst-performing noise distribution.
      5. The additive property of vectors works because the sum of two word vectors is related to the product of their context distributions, acting like a logical AND function.
    save_as: answers.reading_detail
    next: round_table

  - id: round_table
    type: question
    topic: "Round Table Discussion"
    say: |
      Choose ONE role for mini-debates "Mathematics vs. Linguistics in Modern NLP":

      A) The Pure Mathematician: Skeptical. Believes simple vector addition is too rough.
      B) The Machine Learning Engineer: Enthusiast. Defends Negative Sampling and Subsampling.
      C) The Computational Linguist: Believes Skip-gram ignores word order and idioms.

      Write a short argument (3-4 sentences) from your chosen role using these phrases:
      - Stating an opinion: From a mathematical perspective, it seems that... / I strongly believe that...
      - Agreeing/Disagreeing: I see your point, but we must consider... / That is a valid point, however...
      - Referring to the text: As stated in the article, hierarchical softmax reduces...
      - Clarifying: Could you elaborate on how...?
    save_as: answers.round_table
    next: grade

  - id: grade
    type: llm
    model: yandexgpt-pro
    temperature: 0
    prompt: prompts.grade
    inputs: [student_context, rubric, answers, profile]
    output: schemas.grade
    checks:
      - "accuracy: int 0..20"
      - "fluency: int 0..10"
    on_check_fail: "retry 1 time"
    compute: "total = accuracy + fluency"
    save_as: grade
    next: report

  - id: report
    type: llm
    model: yandexgpt-pro
    temperature: 0.2
    prompt: prompts.report
    inputs: [student_context, answers, grade]
    output: schemas.report
    save_as: report
    next: deliver

  - id: deliver
    type: action
    do:
      build_file: templates.final_md
      send_to_teacher: "final_md + teacher_meta"
      send_to_student: "final_md"
      write_row: "results_table"
      update_profile: grade.profile_notes
    say: "Here is your Digital Presentation. Great work!"
    next: done

rubric:
  accuracy:
    "17-20": "Accurate understanding of the article; correct answers to scanning and detail questions; strong academic vocabulary"
    "13-16": "Mostly correct answers; minor misunderstandings; good vocabulary"
    "9-12": "Several incorrect answers; limited understanding of key concepts"
    "5-8": "Many incorrect answers; poor comprehension"
    "0-4": "Minimal understanding; most answers incorrect"
  fluency:
    "9-10": "Coherent, well-structured arguments; excellent use of academic phrases"
    "7-8": "Good structure; some academic phrases used"
    "5-6": "Basic structure; limited academic language"
    "3-4": "Fragmented arguments; poor structure"
    "0-2": "Incoherent; minimal effort"

prompts:
  grade: |
    Ты экспертный тьютор по академическому английскому (ESP для математиков).
    Оцени ответы студента по статье Mikolov et al. (2013).

    {profile_block}

    КОНТЕКСТ: {student_context}

    ОТВЕТЫ СТУДЕНТА:
    Warm-up: {warmup}
    Vocabulary Matching: {vocab_matching}
    Scanning: {scanning}
    Reading for Detail: {reading_detail}
    Round Table: {round_table}

    ПРАВИЛЬНЫЕ ОТВЕТЫ:
    Vocabulary Matching: 1-D, 2-H, 3-E, 4-F, 5-A, 6-B, 7-G, 8-C
    Scanning: 1. 1986; 2. More than 100 billion; 3. P(wi) = 1 - sqrt(t / f(wi)); 4. Around 10^-5; 5. 300-dimensional
    Reading for Detail: 1. False; 2. True; 3. False; 4. False; 5. True

    Оценивай по двум критериям:
    1. ACCURACY (/20): правильность ответов, понимание статьи, академическая лексика
    2. FLUENCY (/10): связность аргументов, использование академических фраз

    Верни СТРОГО JSON без markdown:
    {{
      "accuracy": <int 0-20>,
      "fluency": <int 0-10>,
      "total": <int 0-30>,
      "strengths": ["...", "..."],
      "improvements": ["...", "..."],
      "errors": [{{"section": "...", "original": "...", "corrected": "...", "explanation": "..."}}],
      "profile_notes": {{
        "recurring_errors": ["..."],
        "resolved_since_last": ["..."],
        "estimated_level": "B1 | B1+ | B2",
        "academic_vocabulary_gaps": ["..."]
      }}
    }}

    Правила:
    - errors: ровно 2-3 пункта из разных секций
    - profile_notes: отметь прогресс в академическом чтении
    - Весь фидбек на АНГЛИЙСКОМ

  report: |
    Ты экспертный тьютор. Сформируй Digital Presentation по статье Mikolov et al. (2013).

    ИСХОДНАЯ СТАТЬЯ: https://arxiv.org/abs/1310.4546

    ОТВЕТЫ СТУДЕНТА:
    Warm-up: {warmup}
    Vocabulary Matching: {vocab_matching}
    Scanning: {scanning}
    Reading for Detail: {reading_detail}
    Round Table: {round_table}

    ОЦЕНКА:
    {grade_json}

    Сформируй Markdown-отчет:

    ## 1. Source Material
    Название статьи и активная ссылка на arXiv.

    ## 2. Vocabulary Key
    Таблица из 8 терминов с определениями и русским эквивалентом.

    ## 3. Reading Comprehension Keys
    Ответы на Scanning и Reading for Detail с краткими пояснениями.

    ## 4. Round Table Feedback
    Анализ аргумента студента:
    - Выбранная роль
    - Использованные полезные фразы
    - Рекомендации по улучшению Academic English (Accuracy & Fluency)

    ## 5. Performance Metrics
    | Criterion | Score | Max |
    |-----------|-------|-----|
    | Accuracy | {accuracy} | 20 |
    | Fluency | {fluency} | 10 |
    | **Total** | **{total}** | **30** |

    ## 6. Detailed Feedback
    **Strengths**: {strengths}
    **Areas for Improvement**: {improvements}

    Output ONLY the Markdown.

schemas:
  grade:
    accuracy: "int 0..20"
    fluency: "int 0..10"
    total: "int 0..30"
    strengths: "[str] — 2-3 items"
    improvements: "[str] — 2-3 items"
    errors: "[{{section, original, corrected, explanation}}] — 2-3 items"
    profile_notes:
      recurring_errors: "[str]"
      resolved_since_last: "[str]"
      estimated_level: "B1 | B1+ | B2"
      academic_vocabulary_gaps: "[str]"
  report:
    source_material: "str"
    vocabulary_key: "[{{term, definition, translation}}] — 8 items"
    comprehension_keys: "str"
    round_table_feedback: "str"

templates:
  final_md: |
    # Digital Presentation: Mathematical Foundations of Word Representations

    Student: {student_name} · Date: {date}

    ## 1. Source Material
    **Distributed Representations of Words and Phrases and their Compositionality**
    Mikolov et al., 2013
    [Link to arXiv](https://arxiv.org/abs/1310.4546)

    ## 2. Vocabulary Key
    {for v in vocabulary_key}
    - **{v.term}** — {v.translation}
      {v.definition}
    {end}

    ## 3. Reading Comprehension Keys
    {comprehension_keys}

    ## 4. Round Table Feedback
    {round_table_feedback}

    ## 5. Performance Metrics
    | Criterion | Score |
    |-----------|-------|
    | Accuracy | {accuracy} / 20 |
    | Fluency | {fluency} / 10 |
    | **Total** | **{total} / 30** |

    ## 6. Detailed Feedback
    **Strengths**
    {for s in strengths}- {s}{end}

    **Areas for Improvement**
    {for i in improvements}- {i}{end}

    ---
    {closing}

  teacher_meta: |
    ### Служебное (только для преподавателя)
    Исходные ответы: {answers_raw}
    Флаги: {flags}
    Токены: {token_usage}
    Хеш: {report_hash}
