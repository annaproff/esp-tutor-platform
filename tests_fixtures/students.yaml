# Тестовые студенты для smoke_llm.py.
# Три уровня, чтобы увидеть и стабильность оценки, и то, что рубрика их различает.
# mc_correct — сколько вопросов теста из 10 отвечено верно (первые N считаются верными).
# dialogue — 4 реплики студента в диалоге про идеальный компьютер.
# writing — текст рекомендации (~120 слов) с использованием Passive Voice и Relative Clauses.

weak:
  mc_correct: 4
  dialogue:
    d1: "I want laptop for study and play games. I use it for homework and internet."
    d2: "I need good processor and big screen. Battery is not important."
    d3: "My budget is 500 dollars. I want light laptop but not very important."
    d4: "SSD is good idea. 8GB RAM is enough for me I think."
  writing: |
    Hi teacher. I want recommend laptop for you. You need buy new laptop for study.
    The laptop is recommended by me. It has good processor. The processor is fast.
    You can use it for english lessons. It is cheap and good. I think this is best
    choice for you. Please buy it soon. Thank you.

mid:
  mc_correct: 7
  dialogue:
    d1: "I'm looking for a laptop primarily for my university studies. I need it for programming assignments and writing papers."
    d2: "The most important features would be a good processor, at least 16GB of RAM, and decent battery life since I study in the library."
    d3: "My budget is around $1200. Portability is quite important because I carry it to university every day."
    d4: "That sounds like a good direction. SSD storage would definitely make the system faster, and 8GB of RAM should be sufficient for my needs."
  writing: |
    Dear Professor,
    I would like to recommend a basic user laptop that is suitable for your English teaching needs. A reliable laptop with at least 8GB of RAM should be purchased, as it will be used for preparing lessons and grading papers. The laptop, which has a solid-state drive, will boot up quickly and allow you to work efficiently. Additionally, a model that has a comfortable keyboard is essential for typing documents. The device should be lightweight, so it can be easily carried to classes. I believe this configuration will meet all your requirements perfectly.
    Best regards,
    Student

strong:
  mc_correct: 10
  dialogue:
    d1: "I'm primarily looking for a high-performance laptop for my mathematics studies. I'll be using it for complex calculations, running statistical software, and attending online lectures."
    d2: "The most critical features would be a powerful multi-core processor, at least 32GB of RAM for handling large datasets, and exceptional battery life for long study sessions."
    d3: "My budget is approximately $2000. Portability is moderately important, but I prioritize performance over weight since I mainly work at my desk."
    d4: "That's an excellent suggestion. SSD storage is absolutely essential for fast data access, and while 8GB of RAM might suffice for basic tasks, I'd recommend at least 16GB for my computational work."
  writing: |
    Dear Professor Smith,
    I am writing to recommend a basic user laptop that would be ideally suited for your English teaching requirements. A high-quality laptop, which features at least 8GB of RAM and a solid-state drive, should be purchased to ensure smooth performance during lesson preparation. The device, whose battery life exceeds 10 hours, will be particularly beneficial for your mobile teaching schedule. Furthermore, a model that is equipped with a comfortable keyboard and high-resolution display is strongly recommended, as these features will be utilized daily for grading and document creation. The laptop, which has been designed with portability in mind, can be easily transported between classrooms. I am confident that this configuration will perfectly meet your professional needs.
    Sincerely,
    Your Student